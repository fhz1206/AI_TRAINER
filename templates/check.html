<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="{{ url_for('static', filename='icon.ico') }}">
    <title>模型测试平台</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/check.css') }}">
</head>
<body>
    <canvas id="particles-canvas"></canvas>
    <div class="app-wrapper" style="position:relative;z-index:1;">
        <!-- 顶部导航栏（与训练页一致） -->
        <div class="user-info" style="position:static;display:flex;justify-content:flex-end;align-items:center;gap:6px;padding:12px 0 0;flex-wrap:wrap;">
            <span class="username" id="headerUsername">{{ username }}</span>
            <a href="/home" class="btn-test" title="首页">🏠 首页</a>
            <a href="/train" class="btn-test" title="训练面板">🏠 训练</a>
            <a href="/study" class="btn-test" title="AI基础学习">📖 学习</a>
            <a href="/profile" class="btn-test" title="账号主页">👤 账号</a>
            <button class="btn-logout" onclick="handleLogout()" title="退出登录">
                🚪 退出
            </button>
        </div>
        <!-- 头部（与训练页同款：纯标题） -->
        <header class="app-header">
            <div class="header-glow"></div>
            <h1>🧪 模型测试平台</h1>
            <p class="subtitle">选择模型框架，上传测试数据一键验证效果</p>
        </header>

        <!-- 框架选择标签条（与训练页同款交互） -->
        <div class="tabs-container" role="tablist" id="frameworkTabs">
            <button type="button" class="tab-btn active" data-fw="image" onclick="switchFrameworkTab('image')">
                <span>🖼️</span> CNN 分类
            </button>
            <button type="button" class="tab-btn" data-fw="image_vit" onclick="switchFrameworkTab('image_vit')">
                <span>🔷</span> ViT 分类
            </button>
            <button type="button" class="tab-btn" data-fw="text" onclick="switchFrameworkTab('text')">
                <span>📝</span> 文本生成
            </button>
            <button type="button" class="tab-btn" data-fw="text_cls" onclick="switchFrameworkTab('text_cls')">
                <span>🏷️</span> 语言分类
            </button>
            <button type="button" class="tab-btn" data-fw="diffusion" onclick="switchFrameworkTab('diffusion')">
                <span>🎨</span> 图像生成
            </button>
            <button type="button" class="tab-btn" data-fw="diffusion_edit" onclick="switchFrameworkTab('diffusion_edit')">
                <span>🖌️</span> 图像编辑
            </button>
            <button type="button" class="tab-btn" data-fw="multimodal" onclick="switchFrameworkTab('multimodal')">
                <span>🧩</span> 多模态
            </button>
            <button type="button" class="tab-btn" data-fw="head_mode" onclick="switchFrameworkTab('head_mode')">
                <span>✋</span> 手部检测
            </button>
        </div>

        <!-- 当前选中模型信息行 -->
        <div id="modelInfoLine" style="margin:-12px 0 16px;font-size:13px;color:var(--text-secondary);min-height:18px;"></div>

        <!-- 兼容层：保留原下拉与刷新控件（JS 钩子不变），仅视觉隐藏 -->
        <div aria-hidden="true" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;">
            <label>模型框架：</label>
            <select id="frameworkSelect" class="form-select" onchange="onFrameworkChange()">
                <option value="image">CNN 图片分类模型</option>
                <option value="image_vit">ViT 图像分类模型</option>
                <option value="text">Transformer 文本生成模型</option>
                <option value="text_cls">语言分类模型</option>
                <option value="diffusion">扩散图像生成模型</option>
                <option value="diffusion_edit">扩散图像编辑模型</option>
                <option value="multimodal">多模态图文模型</option>
                <option value="head_mode">✋ 手部关键点检测</option>
            </select>
            <label>选择模型：</label>
            <select id="modelSelect" class="form-select">
                <option value="">请先选择框架</option>
            </select>
            <button class="btn-secondary" onclick="loadModels()">🔄 刷新</button>
        </div>

        <!-- 主体布局：左代码+上传，右结果 -->
        <div class="check-layout">
            <!-- 左侧列 -->
            <div class="left-col">
                <!-- 代码编辑区 -->
                <div class="card">
                    <div class="card-header">
                        <span class="icon">💻</span>
                        <h3>测试代码（支持自定义修改）</h3>
                        <button class="btn-secondary" style="padding: 4px 10px; font-size: 12px; margin-left: auto;" onclick="resetCode()">↺ 恢复默认模板</button>
                    </div>
                    <div class="editor-wrapper">
                        <div class="editor-container">
                            <div class="line-numbers" id="lineNumbers">1</div>
                            <textarea id="testCode" class="code-editor" spellcheck="false"></textarea>
                        </div>
                        <div class="highlight-layer" id="highlightLayer"></div>
                    </div>
                    <div class="test-actions">
                        <button class="btn-run" id="runBtn" onclick="runTest()">▶️ 运行测试</button>
                        <button class="btn-secondary" onclick="clearResult()">🗑️ 清空结果</button>
                    </div>
                </div>

                <!-- 测试数据上传区（文本框架下自动隐藏） -->
                <div class="card" id="testUploadCard">
                    <div class="card-header">
                        <span class="icon">📁</span>
                        <h3>上传测试数据集</h3>
                        <span class="badge" id="testFileBadge">未上传</span>
                    </div>
                    <div class="upload-tip-test" id="testUploadTip">
                        默认显示CNN图片测试要求，切换框架后自动更新
                    </div>
                    <div class="upload-zone" id="testUploadZone">
                        <div class="upload-icon-wrap">📤</div>
                        <div class="upload-text">
                            点击或拖拽上传测试数据集<br>
                            <small id="testUploadSmall">仅支持 .zip 格式，结构同训练数据集</small>
                        </div>
                    </div>
                    <input type="file" id="testFileInput" style="display:none">
                    <div class="error-box" id="testErrorBox"></div>
                    <div id="selectedTestFile"></div>
                </div>
            </div>

            <!-- 右侧列：测试结果 -->
            <div class="right-col">
                <div class="card" style="height: 100%;">
                    <div class="card-header">
                        <span class="icon">📊</span>
                        <h3>测试结果</h3>
                        <span class="badge" id="testStatusBadge">等待运行</span>
                    </div>
                    <div class="result-area" id="testResult">
                        <span class="result-info">👋 请先选择模型、上传测试数据，修改测试代码后点击运行</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
    <script src="{{ url_for('static', filename='js/check.js') }}" defer></script>
<script src="{{ url_for('static', filename='js/particles.js') }}"></script>
</body>
</html>
