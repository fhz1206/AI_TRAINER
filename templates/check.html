<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="{{ url_for('static', filename='icon.ico') }}">
    <title>模型测试平台</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <style>
        /* 原有样式完全保留，新增手部检测专属样式 */
        .hand-result-table {
            width: 100%;
            border-collapse: collapse;
            color: #d4d4d4;
            font-size: 13px;
            margin-top: 8px;
            max-height: 300px;
            overflow-y: auto;
            display: block;
        }
        .hand-result-table th, .hand-result-table td {
            border: 1px solid #444;
            padding: 6px 8px;
            text-align: left;
            min-width: 80px;
        }
        .hand-result-table th {
            background: #2d2d2d;
            font-weight: 500;
            position: sticky;
            top: 0;
        }
        .hand-result-table tr:nth-child(even) {
            background: rgba(255,255,255,0.02);
        }
        .hand-img {
            max-width: 100%;
            border-radius: 6px;
            margin-top: 8px;
            border: 1px solid #444;
            max-height: 400px;
            object-fit: contain;
        }
        /* 原有样式完全保留 */
        .check-layout {
            display: grid;
            grid-template-columns: 3fr 2fr;
            gap: 24px;
            margin-top: 20px;
        }
        @media (max-width: 1200px) {
            .check-layout {
                grid-template-columns: 1fr 1fr;
            }
        }
        @media (max-width: 900px) {
            .check-layout {
                grid-template-columns: 1fr;
            }
        }
        .left-col, .right-col {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        /* ==================== 代码编辑器（带行号+语法高亮） ==================== */
        .editor-wrapper {
            position: relative;
            width: 100%;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            overflow: hidden;
            background: #1e1e1e;
            transition: border-color 0.2s;
        }
        .editor-wrapper:focus-within {
            border-color: var(--accent);
        }
        .editor-container {
            display: flex;
            min-height: 420px;
            max-height: 60vh;
        }
        /* 行号栏 */
        .line-numbers {
            flex-shrink: 0;
            width: 52px;
            padding: 16px 8px 16px 12px;
            background: #1a1a2e;
            color: #858585;
            font-family: 'Consolas', 'Monaco', 'Courier New', monospace;
            font-size: 14px;
            line-height: 1.6;
            text-align: right;
            user-select: none;
            overflow: hidden;
            border-right: 1px solid rgba(255,255,255,0.06);
        }
        /* 语法高亮层 */
        .highlight-layer {
            position: absolute;
            top: 0;
            left: 52px;
            right: 0;
            bottom: 0;
            padding: 16px;
            font-family: 'Consolas', 'Monaco', 'Courier New', monospace;
            font-size: 14px;
            line-height: 1.6;
            white-space: pre-wrap;
            word-wrap: break-word;
            overflow-y: auto;
            overflow-x: hidden;
            color: #e0e0e0;
            pointer-events: none;
            tab-size: 4;
        }
        /* textarea 输入层 */
        .code-editor {
            position: relative;
            width: 100%;
            min-height: 420px;
            max-height: 60vh;
            background: transparent;
            color: #e0e0e0;
            border: none;
            border-radius: 0;
            padding: 16px;
            font-family: 'Consolas', 'Monaco', 'Courier New', monospace;
            font-size: 14px;
            line-height: 1.6;
            resize: none;
            outline: none;
            tab-size: 4;
            white-space: pre-wrap;
            word-wrap: break-word;
            overflow-y: auto;
            overflow-x: hidden;
            -webkit-text-fill-color: transparent;
            caret-color: #ffffff;
            z-index: 1;
        }
        .code-editor::selection {
            background: rgba(99, 102, 241, 0.4);
            -webkit-text-fill-color: #ffffff;
        }

        /* ==================== 语法高亮颜色（高亮版） ==================== */
        .hl-keyword { color: #ff79c6; }       /* 关键字：亮粉 */
        .hl-builtin { color: #50fa7b; }       /* 内置函数：亮绿 */
        .hl-string  { color: #ffb86c; }       /* 字符串：亮橙 */
        .hl-comment { color: #8be9fd; font-style: italic; }  /* 注释：亮青 */
        .hl-number  { color: #bd93f9; }       /* 数字：亮紫 */
        .hl-decorator { color: #f1fa8c; }     /* 装饰器：亮黄 */
        .hl-funcall { color: #f1fa8c; }       /* 函数调用：亮黄 */
        .hl-self    { color: #8be9fd; }       /* self：亮青 */
        .hl-operator { color: #ff79c6; }      /* 运算符：亮粉 */
        .hl-punctuation { color: #e0e0e0; }   /* 括号、冒号：亮白 */

        .upload-tip-test {
            background: var(--bg-secondary);
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 12px;
            font-size: 14px;
            color: var(--text-secondary);
        }
        .test-actions {
            display: flex;
            gap: 12px;
            margin-top: 12px;
        }
        .btn-run {
            padding: 10px 24px;
            background: var(--accent);
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 15px;
            font-weight: 500;
            transition: all 0.2s;
        }
        .btn-run:hover {
            opacity: 0.9;
            transform: translateY(-1px);
        }
        .btn-run:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }
        .btn-secondary {
            padding: 10px 24px;
            background: var(--bg-secondary);
            color: var(--text-primary);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            cursor: pointer;
            font-size: 15px;
            transition: all 0.2s;
        }
        .btn-secondary:hover {
            background: var(--border-color);
        }
        .result-area {
            background: #1e1e1e;
            color: #d4d4d4;
            border-radius: 8px;
            padding: 16px;
            min-height: 420px;
            max-height: 60vh;
            overflow-y: auto;
            font-family: 'Consolas', 'Monaco', monospace;
            font-size: 13px;
            line-height: 1.6;
            white-space: pre-wrap;
            word-break: break-all;
        }
        .result-success {
            color: #22c55e;
        }
        .result-error {
            color: #ef4444;
        }
        .result-info {
            color: #3b82f6;
        }
        .form-select {
            padding: 6px 12px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
            background: var(--bg-secondary);
            color: var(--text-primary);
            font-size: 14px;
            outline: none;
        }
        .form-select option {
            background: #1a1a2e;
            color: var(--text-primary);
        }
        .form-select:focus {
            border-color: var(--accent);
        }
        .form-select:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        .selected-file {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: var(--bg-secondary);
            padding: 8px 12px;
            border-radius: 6px;
            margin-top: 8px;
            font-size: 14px;
        }
        .selected-file .remove-file {
            color: #ef4444;
            cursor: pointer;
            padding: 2px 6px;
            border-radius: 4px;
        }
        .selected-file .remove-file:hover {
            background: #fecaca;
        }
        #testUploadCard .upload-zone {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .upload-zone.drag-over {
            border-color: var(--accent) !important;
            background: rgba(59, 130, 246, 0.05) !important;
            transform: scale(1.01);
        }
        .upload-zone {
            transition: all 0.2s;
        }
    </style>
</head>
<body>
    <canvas id="particles-canvas"></canvas>
    <div class="app-wrapper" style="position:relative;z-index:1;">
        <!-- 头部（和ITPP.html一致） -->
        <header class="app-header">
            <div class="header-glow"></div>
            <h1>🧪 模型测试平台</h1>
            <p class="subtitle">选择模型和测试数据，自定义测试逻辑验证效果</p>
            <div class="user-info">
                <span class="username" id="headerUsername">{{ username }}</span>
                <a href="/home" class="btn-test" title="首页">🏠 首页</a>
                <a href="/train" class="btn-test" title="训练面板">🏠 训练</a>
                <a href="/study" class="btn-test" title="AI基础学习">📖 学习</a>
                <a href="/profile" class="btn-test" title="账号主页">👤 账号</a>
                <button class="btn-logout" onclick="handleLogout()" title="退出登录">
                    🚪 退出
                </button>
            </div>
        </header>

        <!-- 顶部控制栏：框架选择+模型选择 -->
        <div class="card" style="margin-top: 20px;">
            <div class="form-group" style="display: flex; gap: 20px; align-items: center; flex-wrap: wrap;">
                <div>
                    <label style="margin-right: 8px;">模型框架：</label>
                    <!-- 新增head_mode框架选项 -->
                    <select id="frameworkSelect" class="form-select" onchange="onFrameworkChange()">
                        <option value="image">CNN 图片分类模型</option>
                        <option value="image_vit">ViT 图像分类模型</option>
                        <option value="text">Transformer 文本生成模型</option>
                        <option value="diffusion">扩散图像生成模型</option>
                        <option value="diffusion_edit">扩散图像编辑模型</option>
                        <option value="multimodal">多模态图文模型</option>
                        <option value="head_mode">✋ 手部关键点检测</option>
                    </select>
                </div>
                <div>
                    <label style="margin-right: 8px;">选择模型：</label>
                    <select id="modelSelect" class="form-select">
                        <option value="">请先选择框架</option>
                    </select>
                    <button class="btn-secondary" style="padding: 4px 12px; margin-left: 8px; font-size: 13px;" onclick="loadModels()">🔄 刷新</button>
                </div>
            </div>
        </div>

        <!-- 主体布局：左代码+上传，右结果 -->
        <div class="check-layout">
            <!-- 左侧列 -->
            <div class="left-col">
                <!-- 代码编辑区 -->
                <div class="card">
                    <div class="card-header">
                        <span class="icon">💻</span>
                        <h3>测试代码（支持自定义修改）</h3>
                        <button class="btn-secondary" style="padding: 4px 10px; font-size: 12px; margin-left: auto;" onclick="resetCode()">↺ 恢复默认模板</button>
                    </div>
                    <div class="editor-wrapper">
                        <div class="editor-container">
                            <div class="line-numbers" id="lineNumbers">1</div>
                            <textarea id="testCode" class="code-editor" spellcheck="false"></textarea>
                        </div>
                        <div class="highlight-layer" id="highlightLayer"></div>
                    </div>
                    <div class="test-actions">
                        <button class="btn-run" id="runBtn" onclick="runTest()">▶️ 运行测试</button>
                        <button class="btn-secondary" onclick="clearResult()">🗑️ 清空结果</button>
                    </div>
                </div>

                <!-- 测试数据上传区（文本框架下自动隐藏） -->
                <div class="card" id="testUploadCard">
                    <div class="card-header">
                        <span class="icon">📁</span>
                        <h3>上传测试数据集</h3>
                        <span class="badge" id="testFileBadge">未上传</span>
                    </div>
                    <div class="upload-tip-test" id="testUploadTip">
                        默认显示CNN图片测试要求，切换框架后自动更新
                    </div>
                    <div class="upload-zone" id="testUploadZone">
                        <div class="upload-icon-wrap">📤</div>
                        <div class="upload-text">
                            点击或拖拽上传测试数据集<br>
                            <small id="testUploadSmall">仅支持 .zip 格式，结构同训练数据集</small>
                        </div>
                    </div>
                    <input type="file" id="testFileInput" style="display:none">
                    <div class="error-box" id="testErrorBox"></div>
                    <div id="selectedTestFile"></div>
                </div>
            </div>

            <!-- 右侧列：测试结果 -->
            <div class="right-col">
                <div class="card" style="height: 100%;">
                    <div class="card-header">
                        <span class="icon">📊</span>
                        <h3>测试结果</h3>
                        <span class="badge" id="testStatusBadge">等待运行</span>
                    </div>
                    <div class="result-area" id="testResult">
                        <span class="result-info">👋 请先选择模型、上传测试数据，修改测试代码后点击运行</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
    <script>
        // 全局状态
        let currentFramework = 'image';
        let selectedTestDataPath = null;
        let isRunning = false;

        // 测试代码模板已迁移至本地 test_templates/ 目录，经 /api/test_template/<name> 按需加载。
        // 此处仅保留 head_mode 的内置兜底文本（接口不可用时仍可离线填充）。
        const _templateCache = {};      // 已拉取的模板缓存
        const _templatePending = {};    // 进行中的请求去重
        const codeTemplates = {};       // 兼容旧引用点：加载结果会回写到此处

        async function loadCodeTemplate(name) {
            if (_templateCache[name]) return _templateCache[name];
            if (!_templatePending[name]) {
                _templatePending[name] = fetch(`/api/test_template/${name}`)
                    .then(r => r.json())
                    .then(d => {
                        if (d.status !== 'success') throw new Error(d.message || '模板加载失败');
                        _templateCache[name] = d.code;
                        codeTemplates[name] = d.code;   // 回写，兼容旧引用
                        return d.code;
                    })
                    .finally(() => { delete _templatePending[name]; });
            }
            return _templatePending[name];
        }

        function fallbackTemplate(name) {
            return _builtinFallbacks[name] ||
                '# 模板加载失败，请刷新页面重试；或直接手动编写测试代码\n';
        }

        // 按框架名把模板填入编辑器（失败时回退内置兜底并提示）
        async function applyCodeTemplate(name) {
            const editor = document.getElementById('testCode');
            try {
                editor.value = await loadCodeTemplate(name);
            } catch (e) {
                console.error('模板加载失败:', e);
                editor.value = fallbackTemplate(name);
            }
            refreshEditor();
        }

        // head_mode 内置兜底（完整检测代码，可直接离线运行）
        const _builtinFallbacks = {
            head_mode: `# 手部关键点检测（官方Tasks API标准写法，上传图片直接运行）
import cv2
import numpy as np
import base64
import mediapipe as mp

# -------------------------- 初始化内置模型（自动加载，无需修改） --------------------------
print("正在加载内置手部检测模型...")
try:
    if '_global_hand_models' not in globals() or _global_hand_models is None:
        _global_hand_models = _init_hand_models()
    detector = _global_hand_models
    if detector is None:
        raise RuntimeError("模型初始化返回空值")
    print("✅ 模型加载完成")
except Exception as e:
    raise RuntimeError(f"模型加载失败：{str(e)}")

# -------------------------- 手部检测逻辑（官方Tasks API标准调用） --------------------------
img_path = test_data_path
print(f"正在读取测试图片：{img_path}")
img = cv2.imread(img_path)
if img is None:
    raise ValueError(f"无法读取图片：{img_path}，请检查文件是否损坏")
img_rgb = cv2.cvtColor(img, cv2.COLOR_BGR2RGB)
h, w = img.shape[:2]

# 执行手部检测
print("正在检测手部关键点...")
if detector is None:
    raise RuntimeError("手部检测模型未成功加载，请检查后端环境")
mp_image = mp.Image(image_format=mp.ImageFormat.SRGB, data=img_rgb)
results = detector.detect(mp_image)

# 处理检测结果
if not results.hand_landmarks:
    print("❌ 未检测到手部，请上传清晰的手部照片（正面、背景简洁、手部无遮挡）")
    _hand_detection_result = {
        'error': '未检测到手部',
        'message': '未检测到手部，请上传清晰的手部照片（正面、背景简洁、手部无遮挡）'
    }
else:
    # 提取21个关键点，转像素坐标
    hand_landmarks = results.hand_landmarks[0]
    keypoints = []
    for lm in hand_landmarks:
        x = int(lm.x * w)
        y = int(lm.y * h)
        conf = 1.0
        keypoints.append([x, y, conf])
    keypoints = np.array(keypoints, dtype=np.float32)

    # 关键点名称
    keypoint_names = ["手腕", "大拇指根部", "大拇指第一关节", "大拇指第二关节", "大拇指指尖",
                      "食指根部", "食指第一关节", "食指第二关节", "食指指尖",
                      "中指根部", "中指第一关节", "中指第二关节", "中指指尖",
                      "无名指根部", "无名指第一关节", "无名指第二关节", "无名指指尖",
                      "小指根部", "小指第一关节", "小指第二关节", "小指指尖"]

    print("\\n=== 手部关键点检测结果 ===")
    keypoint_list = []
    for idx, (x, y, conf) in enumerate(keypoints):
        print(f"关键点{idx}（{keypoint_names[idx]}）：x={int(x)}, y={int(y)}, 置信度={float(conf):.4f}")
        keypoint_list.append({
            'id': idx,
            'name': keypoint_names[idx],
            'x': int(x),
            'y': int(y),
            # 🛠️ 修复：转成原生float，确保JSON能序列化
            'confidence': float(conf)
        })

    # 生成基础标注图
    basic_img = img_rgb.copy()
    for idx, (x, y, conf) in enumerate(keypoints):
        if conf > 0.5:
            cv2.circle(basic_img, (int(x), int(y)), 5, (0, 255, 0), -1)
            cv2.putText(basic_img, str(idx), (int(x)+10, int(y)-10), cv2.FONT_HERSHEY_SIMPLEX, 0.5, (0,0,255), 1)
    _, basic_buffer = cv2.imencode('.jpg', cv2.cvtColor(basic_img, cv2.COLOR_RGB2BGR))
    basic_base64 = base64.b64encode(basic_buffer).decode('utf-8')

    # 生成彩色骨架图
    HAND_CONNECTIONS = [
        (0,1),(1,2),(2,3),(3,4), (0,5),(5,6),(6,7),(7,8),
        (0,9),(9,10),(10,11),(11,12), (0,13),(13,14),(14,15),(15,16),
        (0,17),(17,18),(18,19),(19,20), (5,9),(9,13),(13,17)
    ]
    CONNECTION_COLORS = {
        (0,1):(255,165,0), (1,2):(255,165,0), (2,3):(255,165,0), (3,4):(255,165,0),
        (0,5):(0,255,0), (5,6):(0,255,0), (6,7):(0,255,0), (7,8):(0,255,0),
        (0,9):(0,0,255), (9,10):(0,0,255), (10,11):(0,0,255), (11,12):(0,0,255),
        (0,13):(128,0,128), (13,14):(128,0,128), (14,15):(128,0,128), (15,16):(128,0,128),
        (0,17):(255,0,0), (17,18):(255,0,0), (18,19):(255,0,0), (19,20):(255,0,0),
        (5,9):(255,255,0), (9,13):(255,255,0), (13,17):(255,255,0)
    }
    skeleton_img = img_rgb.copy()
    for conn in HAND_CONNECTIONS:
        s_idx, e_idx = conn
        s_pt = keypoints[s_idx]
        e_pt = keypoints[e_idx]
        if s_pt[2] > 0.5 and e_pt[2] > 0.5:
            color = CONNECTION_COLORS.get(conn, (255,255,255))
            cv2.line(skeleton_img, (int(s_pt[0]), int(s_pt[1])), (int(e_pt[0]), int(e_pt[1])), color, 3)
    for idx, (x, y, conf) in enumerate(keypoints):
        if conf > 0.5:
            cv2.circle(skeleton_img, (int(x), int(y)), 6, (0,255,255), -1)
            cv2.putText(skeleton_img, str(idx), (int(x)+10, int(y)-10), cv2.FONT_HERSHEY_SIMPLEX, 0.6, (255,0,0), 2)
    _, skeleton_buffer = cv2.imencode('.jpg', cv2.cvtColor(skeleton_img, cv2.COLOR_RGB2BGR))
    skeleton_base64 = base64.b64encode(skeleton_buffer).decode('utf-8')

    _hand_detection_result = {
        'keypoints': keypoint_list,
        'basic_image': f"data:image/jpeg;base64,{basic_base64}",
        'skeleton_image': f"data:image/jpeg;base64,{skeleton_base64}",
        'message': '检测成功'
    }
    print(f"\\n✅ 检测完成，共识别到{len(keypoint_list)}个关键点")`
        };

        // ==================== 语法高亮引擎 ====================
        const PY_KW = ['import','from','def','class','if','elif','else','for','while','try','except','finally','with','as','return','yield','raise','pass','break','continue','and','or','not','in','is','True','False','None','global','nonlocal','lambda','assert','del','exit'];
        const PY_BI = ['print','range','len','int','str','float','list','dict','set','tuple','type','isinstance','hasattr','getattr','setattr','sorted','enumerate','zip','map','filter','open','super','abs','max','min','sum','round','format','input','iter','next','any','all','reversed','slice'];

        function escH(t){return t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

        function hlLine(line){
            let r='',i=0;
            while(i<line.length){
                if(line[i]==='#'){r+='<span class="hl-comment">'+escH(line.slice(i))+'</span>';return r;}
                if((line[i]==='"'&&line[i+1]==='"'&&line[i+2]==='"')||(line[i]==="'"&&line[i+1]==="'"&&line[i+2]==="'")){
                    let q=line[i]==='"'?'"""':"'''",end=line.indexOf(q,i+3);
                    if(end!==-1){r+='<span class="hl-string">'+escH(line.slice(i,end+3))+'</span>';i=end+3;}
                    else{r+='<span class="hl-string">'+escH(line.slice(i))+'</span>';return r;}
                    continue;
                }
                if(line[i]==='"'||line[i]==="'"){
                    let q=line[i],j=i+1;
                    while(j<line.length&&line[j]!==q){if(line[j]==='\\\\')j++;j++;}
                    r+='<span class="hl-string">'+escH(line.slice(i,j+1))+'</span>';i=j+1;continue;
                }
                if(line[i]==='f'&&(line[i+1]==='"'||line[i+1]==="'")){
                    let q=line[i+1],j=i+2;
                    while(j<line.length&&line[j]!==q){if(line[j]==='\\\\')j++;j++;}
                    r+='<span class="hl-string">f</span><span class="hl-string">'+escH(line.slice(i+1,j+1))+'</span>';i=j+1;continue;
                }
                if(line[i]==='@'&&(i===0||/\\s/.test(line[i-1]))){
                    let j=i+1;while(j<line.length&&/[a-zA-Z0-9_.]/.test(line[j]))j++;
                    r+='<span class="hl-decorator">'+escH(line.slice(i,j))+'</span>';i=j;continue;
                }
                if(/[a-zA-Z_]/.test(line[i])){
                    let j=i;while(j<line.length&&/[a-zA-Z0-9_]/.test(line[j]))j++;
                    let w=line.slice(i,j);
                    if(w==='self')r+='<span class="hl-self">'+w+'</span>';
                    else if(PY_KW.includes(w))r+='<span class="hl-keyword">'+w+'</span>';
                    else if(PY_BI.includes(w))r+='<span class="hl-builtin">'+w+'</span>';
                    else if(j<line.length&&line[j]==='(')r+='<span class="hl-funcall">'+escH(w)+'</span>';
                    else r+=escH(w);
                    i=j;continue;
                }
                if(/[0-9]/.test(line[i])){
                    let j=i;while(j<line.length&&/[0-9.eExXoObBaAfF_]/.test(line[j]))j++;
                    r+='<span class="hl-number">'+escH(line.slice(i,j))+'</span>';i=j;continue;
                }
                if('+-*/%=<>!&|^~'.includes(line[i])){r+='<span class="hl-operator">'+escH(line[i])+'</span>';i++;continue;}
                r+=escH(line[i]);i++;
            }
            return r;
        }

        var NL=String.fromCharCode(10);
        function hlPy(code){return code.split(NL).map(function(l){return hlLine(l)}).join(NL);}

        function updateLineNumbers(){
            var ed=document.getElementById('testCode'),ln=document.getElementById('lineNumbers');
            var n=ed.value.split(NL).length,nums=[];
            for(var i=1;i<=n;i++)nums.push(i);
            ln.innerHTML=nums.join('<br>');
        }

        function updateHighlight(){
            var ed=document.getElementById('testCode'),hl=document.getElementById('highlightLayer');
            hl.innerHTML=hlPy(ed.value);
        }

        function syncScroll(){
            var ed=document.getElementById('testCode');
            document.getElementById('lineNumbers').scrollTop=ed.scrollTop;
            document.getElementById('highlightLayer').scrollTop=ed.scrollTop;
            document.getElementById('highlightLayer').scrollLeft=ed.scrollLeft;
        }

        function refreshEditor(){updateLineNumbers();updateHighlight();}

        // 页面初始化（等DOM加载完成后再执行，避免元素为null）
        document.addEventListener('DOMContentLoaded', () => {
            // 扩大页面宽度以适配代码编辑器
            const wrapper = document.querySelector('.app-wrapper');
            if (wrapper) wrapper.style.maxWidth = '1400px';
            // 设置默认代码（从本地 test_templates/ 按需加载）
            applyCodeTemplate(currentFramework);
            // 加载模型列表
            loadModels();
            // 绑定上传事件
            bindUploadEvents();
            // 绑定代码编辑器事件
            bindCodeEditor();
            // 初始化上传提示和卡片显示状态
            updateUploadTip();
            // 初始化上传卡片显示状态
            if (currentFramework === 'text') {
                document.getElementById('testUploadCard').style.display = 'none';
            }
        });

        // 框架切换逻辑
        function onFrameworkChange() {
            currentFramework = document.getElementById('frameworkSelect').value;
            // 切换代码模板（按需加载，失败回退内置兜底）
            applyCodeTemplate(currentFramework);
            // 切换上传提示和卡片显示状态
            updateUploadTip();
            // head_mode下模型选择自动禁用，显示内置模型
            const modelSelect = document.getElementById('modelSelect');
            if (currentFramework === 'head_mode') {
                modelSelect.innerHTML = '<option value="built-in_hand_model">内置MediaPipe手部关键点模型 (3.2 MB | 内置)</option>';
                modelSelect.disabled = true; // 禁用选择，避免用户修改
            } else {
                modelSelect.disabled = false;
                loadModels(); // 原有image/text框架加载用户模型
            }
            // 清空已选测试数据
            selectedTestDataPath = null;
            document.getElementById('selectedTestFile').innerHTML = '';
            document.getElementById('testFileBadge').textContent = '未上传';
        }

        // 更新上传提示（同时控制上传卡片显示隐藏）
        function updateUploadTip() {
            const tip = document.getElementById('testUploadTip');
            const small = document.getElementById('testUploadSmall');
            const uploadCard = document.getElementById('testUploadCard');
            const TIPS = {
                image: {
                    html: '<strong>📋 图片测试数据集要求</strong><br>仅支持.zip格式，顶层子文件夹为类别，每个子文件夹内放测试图片，结构同训练数据集',
                    small: '仅支持 .zip 格式，最大500MB', show: true,
                },
                image_vit: {
                    html: '<strong>📋 ViT 测试数据集要求</strong><br>与CNN相同：仅支持.zip格式，顶层子文件夹为类别，每个子文件夹内放测试图片',
                    small: '仅支持 .zip 格式，最大500MB', show: true,
                },
                diffusion: {
                    html: '<strong>🎨 扩散生成测试说明</strong><br>无需上传数据：模型从纯噪声逐步去噪生成图像，结果自动保存到模型目录并在日志中给出路径',
                    small: '扩散生成测试无需上传数据集', show: false,
                },
                diffusion_edit: {
                    html: '<strong>🖌️ 扩散编辑测试说明</strong><br>上传一张图片作为编辑源图（可选；不传则用随机噪声演示）。模型会对其修复/重绘并保存结果',
                    small: '支持 jpg/png/bmp 等图片格式，最大10MB', show: true,
                },
                multimodal: {
                    html: '<strong>🧩 多模态测试说明</strong><br>上传一张图片作为视觉输入（可选），在代码中修改 PROMPT 文本，模型将「看图续写」生成描述',
                    small: '支持 jpg/png/bmp 等图片格式，最大10MB', show: true,
                },
                head_mode: {
                    html: '<strong>📋 手部识别要求</strong><br>请上传单张清晰的手部照片（正面、背景简洁、手部无遮挡），支持jpg/png等常见图片格式',
                    small: '仅支持 jpg/png/bmp 等图片格式，最大10MB', show: true,
                },
            };
            const conf = TIPS[currentFramework] || {
                html: '<strong>📋 文本生成测试说明</strong><br>无需上传数据集，直接输入Prompt即可测试生成效果；如需计算困惑度(PPL)可自行修改测试代码加载本地数据',
                small: '文本生成测试无需上传数据集', show: false,
            };
            tip.innerHTML = conf.html;
            small.textContent = conf.small;
            uploadCard.style.display = conf.show ? 'flex' : 'none';
        }

        // 加载模型列表
        async function loadModels() {
            const framework = document.getElementById('frameworkSelect').value;
            const select = document.getElementById('modelSelect');
            // 头模式不请求后端，直接使用内置模型
            if (framework === 'head_mode') return;
            try {
                const res = await fetch(`/api/list_user_models?framework=${framework}`);
                const data = await res.json();
                if (data.status === 'success') {
                    if (data.models.length === 0) {
                        select.innerHTML = '<option value="">暂无模型，请先在训练平台训练模型</option>';
                    } else {
                        const TYPE_LABEL = {
                            cnn: 'CNN', vit: 'ViT', text: 'Transformer',
                            diffusion: '扩散生成', diffusion_edit: '扩散编辑',
                            multimodal: '多模态', hand: '手部', other: '模型'
                        };
                        select.innerHTML = data.models.map(m =>
                            `<option value="${m.name}">${m.name} (${m.size} | ${TYPE_LABEL[m.type] || m.type})</option>`
                        ).join('');
                    }
                } else {
                    select.innerHTML = '<option value="">加载失败</option>';
                }
            } catch (e) {
                select.innerHTML = '<option value="">加载失败</option>';
                console.error('加载模型列表失败:', e);
            }
        }

        // 绑定上传事件
        function bindUploadEvents() {
            const zone = document.getElementById('testUploadZone');
            const input = document.getElementById('testFileInput');

            // 点击上传
            zone.addEventListener('click', () => input.click());

            // 拖拽上传
            zone.addEventListener('dragover', (e) => {
                e.preventDefault();
                zone.classList.add('drag-over');
            });
            zone.addEventListener('dragleave', () => zone.classList.remove('drag-over'));
            zone.addEventListener('drop', (e) => {
                e.preventDefault();
                zone.classList.remove('drag-over');
                if (e.dataTransfer.files.length > 0) {
                    handleTestFileSelect(e.dataTransfer.files[0]);
                }
            });

            // 文件选择
            input.addEventListener('change', (e) => {
                if (e.target.files.length > 0) {
                    handleTestFileSelect(e.target.files[0]);
                }
            });
        }

        // 处理测试文件选择
        async function handleTestFileSelect(file) {
            // 适配head_mode图片格式校验
            const acceptTypes = currentFramework === 'image' ? ['.zip'] : 
                               currentFramework === 'head_mode' ? ['.jpg', '.jpeg', '.png', '.bmp', '.webp'] : 
                               ['.txt', '.zip'];
            const fileExt = file.name.substring(file.name.lastIndexOf('.')).toLowerCase();
            if (!acceptTypes.includes(fileExt)) {
                showTestError(`仅支持${acceptTypes.join('/')}格式文件`);
                return;
            }

            const formData = new FormData();
            formData.append('file', file);
            formData.append('framework', currentFramework);

            try {
                const res = await fetch('/api/upload_test_data', {
                    method: 'POST',
                    body: formData
                });
                const data = await res.json();
                if (data.status === 'success') {
                    selectedTestDataPath = data.path;
                    document.getElementById('testFileBadge').textContent = `${data.file_count} 个文件`;
                    document.getElementById('selectedTestFile').innerHTML = `
                        <div class="selected-file">
                            <span>📄 ${data.filename}</span>
                            <span class="remove-file" onclick="clearTestFile()">删除</span>
                        </div>
                    `;
                    showTestError('');
                } else {
                    showTestError(data.message || '上传失败');
                }
            } catch (e) {
                showTestError('上传失败: ' + e.message);
            }
        }

        // 删除已选测试文件
        function clearTestFile() {
            selectedTestDataPath = null;
            document.getElementById('testFileInput').value = '';
            document.getElementById('selectedTestFile').innerHTML = '';
            document.getElementById('testFileBadge').textContent = '未上传';
        }

        // 显示上传错误
        function showTestError(msg) {
            const box = document.getElementById('testErrorBox');
            if (msg) {
                box.textContent = '❌ ' + msg;
                box.classList.add('show');
            } else {
                box.classList.remove('show');
            }
        }

        // 代码编辑器事件绑定（Tab+行号+高亮+滚动同步）
        function bindCodeEditor() {
            const editor = document.getElementById('testCode');
            // Tab缩进
            editor.addEventListener('keydown', (e) => {
                if (e.key === 'Tab') {
                    e.preventDefault();
                    const start = editor.selectionStart;
                    const end = editor.selectionEnd;
                    editor.value = editor.value.substring(0, start) + '    ' + editor.value.substring(end);
                    editor.selectionStart = editor.selectionEnd = start + 4;
                    refreshEditor();
                }
            });
            // 输入时刷新行号和高亮
            editor.addEventListener('input', () => { refreshEditor(); });
            // 滚动同步
            editor.addEventListener('scroll', () => { syncScroll(); });
        }

        // 恢复默认代码模板
        function resetCode() {
            applyCodeTemplate(currentFramework);
        }

        // 清空结果
        function clearResult() {
            document.getElementById('testResult').innerHTML = '<span class="result-info">👋 请先选择模型、上传测试数据，修改测试代码后点击运行</span>';
            document.getElementById('testStatusBadge').textContent = '等待运行';
            document.getElementById('testStatusBadge').style.background = 'var(--bg-secondary)';
        }

        // 运行测试
        async function runTest() {
            if (isRunning) return;
            
            const modelName = document.getElementById('modelSelect').value;
            const testCode = document.getElementById('testCode').value.trim();

            // 参数校验适配head_mode
            // head_mode下无需选择模型，跳过模型校验
            if (currentFramework !== 'head_mode' && !modelName) {
                alert('请先选择要测试的模型');
                return;
            }
            // image和head_mode需要上传测试数据，text不需要
            if ((currentFramework === 'image' || currentFramework === 'head_mode') && !selectedTestDataPath) {
                alert(currentFramework === 'image' ? '请先上传测试数据集' : '请先上传手部照片');
                return;
            }
            // 测试代码非空校验，head_mode下自动填充默认代码（已缓存模板优先，否则用内置兜底）
            if (!testCode) {
                if (currentFramework === 'head_mode') {
                    document.getElementById('testCode').value =
                        _templateCache.head_mode || fallbackTemplate('head_mode');
                } else {
                    alert('测试代码不能为空');
                    return;
                }
            }

            // 锁定按钮
            isRunning = true;
            const runBtn = document.getElementById('runBtn');
            runBtn.disabled = true;
            runBtn.textContent = '⏳ 运行中...';
            
            // 更新状态
            const resultArea = document.getElementById('testResult');
            const statusBadge = document.getElementById('testStatusBadge');
            // head_mode下运行提示更友好
            resultArea.innerHTML = currentFramework === 'head_mode' ? 
                '<span class="result-info">🔍 正在检测手部关键点，请稍候...</span>' : 
                '<span class="result-info">🔄 正在运行测试，请稍候...</span>';
            statusBadge.textContent = '运行中';
            statusBadge.style.background = 'var(--accent)';

            try {
                const res = await fetch('/api/run_test', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        framework: currentFramework,
                        model_name: modelName,
                        test_code: document.getElementById('testCode').value,
                        // 文本框架下传空路径即可，后端已做兼容
                        test_data_path: selectedTestDataPath || ''
                    })
                });
                const data = await res.json();

                // 渲染结果
                let resultHtml = '';
                if (data.status === 'success') {
                    resultHtml = `<span class="result-success">✅ 测试成功</span>\n\n`;
                    statusBadge.textContent = '成功';
                    statusBadge.style.background = '#22c55e';
                } else {
                    resultHtml = `<span class="result-error">❌ 测试失败</span>\n`;
                    if (data.error) resultHtml += `<span class="result-error">错误信息:\n${data.error}</span>\n\n`;
                    statusBadge.textContent = '失败';
                    statusBadge.style.background = '#ef4444';
                }
                
                // 添加输出日志
                resultHtml += `<span class="result-info">---------- 运行日志 ----------</span>\n`;
                resultHtml += data.output || '无输出';
                
                // 添加指标
                if (data.metrics && Object.keys(data.metrics).length > 0) {
                    resultHtml += `\n\n<span class="result-info">---------- 测试指标 ----------</span>\n`;
                    for (const [key, value] of Object.entries(data.metrics)) {
                        resultHtml += `${key}: ${value}\n`;
                    }
                }

                // head_mode专属结果渲染
                if (data.head_mode_result) {
                    // 先显示错误信息（如果有）
                    if (data.head_mode_result.error) {
                        resultHtml += `\n\n<span class="result-error">❌ ${data.head_mode_result.message || data.head_mode_result.error}</span>\n`;
                    }
                    // 有关键点坐标和图片才渲染
                    if (data.head_mode_result.keypoints) {
                        const kps = data.head_mode_result.keypoints;
                        // 关键点坐标表格
                        resultHtml += `\n\n<span class="result-info">---------- 手部关键点坐标 ----------</span>\n`;
                        resultHtml += `<table class="hand-result-table">
                            <tr>
                                <th>关键点ID</th>
                                <th>名称</th>
                                <th>X坐标</th>
                                <th>Y坐标</th>
                                <th>置信度</th>
                            </tr>
                            ${kps.map(kp => `
                            <tr>
                                <td>${kp.id}</td>
                                <td>${kp.name}</td>
                                <td>${kp.x}</td>
                                <td>${kp.y}</td>
                                <td>${(kp.confidence * 100).toFixed(2)}%</td>
                            </tr>
                            `).join('')}
                        </table>\n\n`;
                        // 基础标注图
                        if (data.head_mode_result.basic_image) {
                            resultHtml += `<span class="result-info">---------- 基础关键点标注图 ----------</span>\n`;
                            resultHtml += `<img src="${data.head_mode_result.basic_image}" class="hand-img" alt="基础标注图">\n\n`;
                        }
                        // 彩色骨架图
                        if (data.head_mode_result.skeleton_image) {
                            resultHtml += `<span class="result-info">---------- 彩色手部骨架图 ----------</span>\n`;
                            resultHtml += `<img src="${data.head_mode_result.skeleton_image}" class="hand-img" alt="彩色骨架图">\n\n`;
                        }
                    }
                }
                
                resultArea.innerHTML = resultHtml;
            } catch (e) {
                resultArea.innerHTML = `<span class="result-error">❌ 请求失败: ${e.message}</span>`;
                statusBadge.textContent = '失败';
                statusBadge.style.background = '#ef4444';
            } finally {
                // 解锁按钮
                isRunning = false;
                runBtn.disabled = false;
                runBtn.textContent = '▶️ 运行测试';
            }
        }

        // 退出登录（和ITPP.html共用逻辑）
        async function handleLogout() {
            if (!confirm('确定要退出登录吗？')) return;
            try {
                const res = await fetch('/logout', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-Requested-With': 'XMLHttpRequest'
                    }
                });
                const data = await res.json();
                if (data.status === 'success') {
                    window.location.href = '/login';
                } else {
                    alert('退出失败: ' + data.message);
                }
            } catch (e) {
                alert('退出失败: ' + e.message);
            }
        }
    </script>
