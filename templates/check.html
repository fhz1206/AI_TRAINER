    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        /* 原有样式完全保留，新增手部检测专属样式 */
        .hand-result-table {
            width: 100%;
            border-collapse: collapse;
            color: #d4d4d4;
            font-size: 13px;
            margin-top: 8px;
            max-height: 300px;
            overflow-y: auto;
            display: block;
        }
        .hand-result-table th, .hand-result-table td {
            border: 1px solid #444;
            padding: 6px 8px;
            text-align: left;
            min-width: 80px;
        }
        .hand-result-table th {
            background: #2d2d2d;
            font-weight: 500;
            position: sticky;
            top: 0;
        }
        .hand-result-table tr:nth-child(even) {
            background: rgba(255,255,255,0.02);
        }
        .hand-img {
            max-width: 100%;
            border-radius: 6px;
            margin-top: 8px;
            border: 1px solid #444;
            max-height: 400px;
            object-fit: contain;
        }
        /* 原有样式完全保留 */
        .check-layout {
            display: grid;
            grid-template-columns: 3fr 2fr;
            gap: 24px;
            margin-top: 20px;
        }
        @media (max-width: 1200px) {
            .check-layout {
                grid-template-columns: 1fr 1fr;
            }
        }
        @media (max-width: 900px) {
            .check-layout {
                grid-template-columns: 1fr;
            }
        }
        .left-col, .right-col {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        /* ==================== 代码编辑器（带行号+语法高亮） ==================== */
        .editor-wrapper {
            position: relative;
            width: 100%;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            overflow: hidden;
            background: #1e1e1e;
            transition: border-color 0.2s;
        }
        .editor-wrapper:focus-within {
            border-color: var(--accent);
        }
        .editor-container {
            display: flex;
            min-height: 420px;
            max-height: 60vh;
        }
        /* 行号栏 */
        .line-numbers {
            flex-shrink: 0;
            width: 52px;
            padding: 16px 8px 16px 12px;
            background: #1a1a2e;
            color: #858585;
            font-family: 'Consolas', 'Monaco', 'Courier New', monospace;
            font-size: 14px;
            line-height: 1.6;
            text-align: right;
            user-select: none;
            overflow: hidden;
            border-right: 1px solid rgba(255,255,255,0.06);
        }
        /* 语法高亮层 */
        .highlight-layer {
            position: absolute;
            top: 0;
            left: 52px;
            right: 0;
            bottom: 0;
            padding: 16px;
            font-family: 'Consolas', 'Monaco', 'Courier New', monospace;
            font-size: 14px;
            line-height: 1.6;
            white-space: pre-wrap;
            word-wrap: break-word;
            overflow-y: auto;
            overflow-x: hidden;
            color: #e0e0e0;
            pointer-events: none;
            tab-size: 4;
        }
        /* textarea 输入层 */
        .code-editor {
            position: relative;
            width: 100%;
            min-height: 420px;
            max-height: 60vh;
            background: transparent;
            color: #e0e0e0;
            border: none;
            border-radius: 0;
            padding: 16px;
            font-family: 'Consolas', 'Monaco', 'Courier New', monospace;
            font-size: 14px;
            line-height: 1.6;
            resize: none;
            outline: none;
            tab-size: 4;
            white-space: pre-wrap;
            word-wrap: break-word;
            overflow-y: auto;
            overflow-x: hidden;
            -webkit-text-fill-color: transparent;
            caret-color: #ffffff;
            z-index: 1;
        }
        .code-editor::selection {
            background: rgba(99, 102, 241, 0.4);
            -webkit-text-fill-color: #ffffff;
        }

        /* ==================== 语法高亮颜色（高亮版） ==================== */
        .hl-keyword { color: #ff79c6; }       /* 关键字：亮粉 */
        .hl-builtin { color: #50fa7b; }       /* 内置函数：亮绿 */
        .hl-string  { color: #ffb86c; }       /* 字符串：亮橙 */
        .hl-comment { color: #8be9fd; font-style: italic; }  /* 注释：亮青 */
        .hl-number  { color: #bd93f9; }       /* 数字：亮紫 */
        .hl-decorator { color: #f1fa8c; }     /* 装饰器：亮黄 */
        .hl-funcall { color: #f1fa8c; }       /* 函数调用：亮黄 */
        .hl-self    { color: #8be9fd; }       /* self：亮青 */
        .hl-operator { color: #ff79c6; }      /* 运算符：亮粉 */
        .hl-punctuation { color: #e0e0e0; }   /* 括号、冒号：亮白 */

        .upload-tip-test {
            background: var(--bg-secondary);
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 12px;
            font-size: 14px;
            color: var(--text-secondary);
        }
        .test-actions {
            display: flex;
            gap: 12px;
            margin-top: 12px;
        }
        .btn-run {
            padding: 10px 24px;
            background: var(--accent);
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 15px;
            font-weight: 500;
            transition: all 0.2s;
        }
        .btn-run:hover {
            opacity: 0.9;
            transform: translateY(-1px);
        }
        .btn-run:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }
        .btn-secondary {
            padding: 10px 24px;
            background: var(--bg-secondary);
            color: var(--text-primary);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            cursor: pointer;
            font-size: 15px;
            transition: all 0.2s;
        }
        .btn-secondary:hover {
            background: var(--border-color);
        }
        .result-area {
            background: #1e1e1e;
            color: #d4d4d4;

            font-family: 'Consolas', 'Monaco', monospace;
            font-size: 13px;
            line-height: 1.6;
            white-space: pre-wrap;
            word-break: break-all;
        }
        .result-success {
            color: #22c55e;
        }
        .result-error {
            color: #ef4444;
        }
        .result-info {
            color: #3b82f6;
        }
        .form-select {
            padding: 6px 12px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
            background: var(--bg-secondary);
            color: var(--text-primary);
            font-size: 14px;
            outline: none;
        }
        .form-select option {
            background: #1a1a2e;
            color: var(--text-primary);
        }
        .form-select:focus {
            border-color: var(--accent);
        }
        .form-select:disabled {
            opacity: 0.6;
            cursor: not-allowed;

        }

            transition: all 0.2s;
        }

                    <div class="error-box" id="testErrorBox"></div>
                    <div id="selectedTestFile"></div>

            </div>

            <!-- 右侧列：测试结果 -->
            <div class="right-col">
                <div class="card" style="height: 100%;">
                    <div class="card-header">
                        <span class="icon">📊</span>

            </div>
        </div>

    """使用训练时的显式词表进行分词，和TextDataset的char2token映射一致"""
    if char2token is not None:
        # 使用训练时保存的显式词表映射（和训练完全一致）

            // image和head_mode需要上传测试数据，text不需要
            if ((currentFramework === 'image' || currentFramework === 'head_mode') && !selectedTestDataPath) {
                alert(currentFramework === 'image' ? '请先上传测试数据集' : '请先上传手部照片');
                return;
            }
            // 测试代码非空校验，head_mode下自动填充默认代码
            if (!testCode) {
                if (currentFramework === 'head_mode') {
                    document.getElementById('testCode').value = codeTemplates.head_mode;
                } else {
                    alert('测试代码不能为空');
                    return;
                }
            }

            // 锁定按钮
            isRunning = true;
            const runBtn = document.getElementById('runBtn');
            runBtn.disabled = true;
            runBtn.textContent = '⏳ 运行中...';
            
            // 更新状态
            const resultArea = document.getElementById('testResult');
            const statusBadge = document.getElementById('testStatusBadge');
            // head_mode下运行提示更友好
            resultArea.innerHTML = currentFramework === 'head_mode' ? 
                '<span class="result-info">🔍 正在检测手部关键点，请稍候...</span>' : 
                '<span class="result-info">🔄 正在运行测试，请稍候...</span>';
            statusBadge.textContent = '运行中';
            statusBadge.style.background = 'var(--accent)';

            try {
                const res = await fetch('/api/run_test', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        framework: currentFramework,
                        model_name: modelName,
                        test_code: document.getElementById('testCode').value,
                        // 文本框架下传空路径即可，后端已做兼容
                        test_data_path: selectedTestDataPath || ''
                    })
                });
                const data = await res.json();

                // 渲染结果
                let resultHtml = '';
                if (data.status === 'success') {
                    resultHtml = `<span class="result-success">✅ 测试成功</span>\n\n`;
                    statusBadge.textContent = '成功';
                    statusBadge.style.background = '#22c55e';
                } else {
                    resultHtml = `<span class="result-error">❌ 测试失败</span>\n`;
                    if (data.error) resultHtml += `<span class="result-error">错误信息:\n${data.error}</span>\n\n`;
                    statusBadge.textContent = '失败';
                    statusBadge.style.background = '#ef4444';
                }
                
                // 添加输出日志
                resultHtml += `<span class="result-info">---------- 运行日志 ----------</span>\n`;
                resultHtml += data.output || '无输出';
                
                // 添加指标
                if (data.metrics && Object.keys(data.metrics).length > 0) {
                    resultHtml += `\n\n<span class="result-info">---------- 测试指标 ----------</span>\n`;
                    for (const [key, value] of Object.entries(data.metrics)) {
                        resultHtml += `${key}: ${value}\n`;
                    }
                }

                // head_mode专属结果渲染
                if (data.head_mode_result) {
                    // 先显示错误信息（如果有）
                    if (data.head_mode_result.error) {
                        resultHtml += `\n\n<span class="result-error">❌ ${data.head_mode_result.message || data.head_mode_result.error}</span>\n`;
                    }
                    // 有关键点坐标和图片才渲染
                    if (data.head_mode_result.keypoints) {
                        const kps = data.head_mode_result.keypoints;
                        // 关键点坐标表格
                        resultHtml += `\n\n<span class="result-info">---------- 手部关键点坐标 ----------</span>\n`;
                        resultHtml += `<table class="hand-result-table">
                            <tr>
                                <th>关键点ID</th>
                                <th>名称</th>
                                <th>X坐标</th>
                                <th>Y坐标</th>
                                <th>置信度</th>
                            </tr>
                            ${kps.map(kp => `
                            <tr>
                                <td>${kp.id}</td>
                                <td>${kp.name}</td>
                                <td>${kp.x}</td>
                                <td>${kp.y}</td>
                                <td>${(kp.confidence * 100).toFixed(2)}%</td>
                            </tr>
                            `).join('')}
                        </table>\n\n`;
                        // 基础标注图
                        if (data.head_mode_result.basic_image) {
                            resultHtml += `<span class="result-info">---------- 基础关键点标注图 ----------</span>\n`;
                            resultHtml += `<img src="${data.head_mode_result.basic_image}" class="hand-img" alt="基础标注图">\n\n`;
                        }
                        // 彩色骨架图
                        if (data.head_mode_result.skeleton_image) {
                            resultHtml += `<span class="result-info">---------- 彩色手部骨架图 ----------</span>\n`;
                            resultHtml += `<img src="${data.head_mode_result.skeleton_image}" class="hand-img" alt="彩色骨架图">\n\n`;
                        }
                    }
                }
                
                resultArea.innerHTML = resultHtml;
            } catch (e) {
                resultArea.innerHTML = `<span class="result-error">❌ 请求失败: ${e.message}</span>`;
                statusBadge.textContent = '失败';
                statusBadge.style.background = '#ef4444';
            } finally {
                // 解锁按钮
                isRunning = false;
                runBtn.disabled = false;
                runBtn.textContent = '▶️ 运行测试';
            }
        }

        // 退出登录（和ITPP.html共用逻辑）
        async function handleLogout() {
            if (!confirm('确定要退出登录吗？')) return;
            try {
                const res = await fetch('/logout', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-Requested-With': 'XMLHttpRequest'
                    }
                });
                const data = await res.json();
                if (data.status === 'success') {
                    window.location.href = '/login';
                } else {
                    alert('退出失败: ' + data.message);
                }
            } catch (e) {
                alert('退出失败: ' + e.message);
            }
        }
    </script>
