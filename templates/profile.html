<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="{{ url_for('static', filename='icon.ico') }}">
    <title>账号主页</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <style>
        .profile-wrapper { max-width: 800px; margin: 0 auto; padding: 24px 20px; }
        .profile-header { display: flex; align-items: center; gap: 20px; margin-bottom: 24px; flex-wrap: wrap; }
        .profile-avatar { width: 72px; height: 72px; border-radius: 50%; background: var(--accent-gradient); display: flex; align-items: center; justify-content: center; font-size: 32px; color: #fff; flex-shrink: 0; }
        .profile-name { font-size: 24px; font-weight: 700; }
        .profile-meta { color: var(--text-secondary); font-size: 14px; margin-top: 4px; }
        .stats-row { display: flex; gap: 16px; flex-wrap: wrap; margin-bottom: 24px; }
        .stat-card { flex: 1; min-width: 120px; background: var(--bg-card); border: 1px solid var(--border-color); border-radius: var(--radius-md); padding: 20px; text-align: center; backdrop-filter: blur(20px); }
        .stat-card .num { font-size: 28px; font-weight: 700; color: var(--accent-hover); }
        .stat-card .label { font-size: 13px; color: var(--text-muted); margin-top: 4px; }
        .section-title { font-size: 18px; font-weight: 600; margin: 24px 0 16px; padding-bottom: 8px; border-bottom: 1px solid var(--border-color); }
        .form-group { margin-bottom: 16px; }
        .form-group label { display: block; font-size: 13px; color: var(--text-secondary); margin-bottom: 6px; font-weight: 500; }
        .form-group input { width: 100%; max-width: 360px; padding: 10px 12px; background: var(--bg-input); border: 1px solid var(--border-color); border-radius: var(--radius-sm); color: var(--text-primary); font-size: 14px; font-family: inherit; outline: none; transition: all var(--transition); }
        .form-group input:focus { border-color: var(--border-focus); box-shadow: 0 0 0 3px rgba(99,102,241,0.2); }
        .btn-save { padding: 10px 24px; background: var(--accent-gradient); border: none; border-radius: var(--radius-sm); color: #fff; font-size: 14px; font-weight: 600; cursor: pointer; transition: all var(--transition); font-family: inherit; }
        .btn-save:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(99,102,241,0.35); }
        .btn-save:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
        .msg { padding: 10px 14px; border-radius: var(--radius-sm); font-size: 13px; margin-top: 8px; display: none; }
        .msg.success { display: block; background: rgba(34,197,94,0.1); color: var(--success); border: 1px solid rgba(34,197,94,0.2); }
        .msg.error { display: block; background: rgba(239,68,68,0.1); color: var(--error); border: 1px solid rgba(239,68,68,0.2); }
        .log-list { list-style: none; }
        .log-item { display: flex; align-items: flex-start; gap: 12px; padding: 12px 0; border-bottom: 1px solid rgba(255,255,255,0.04); }
        .log-icon { font-size: 20px; flex-shrink: 0; margin-top: 2px; }
        .log-content { flex: 1; min-width: 0; }
        .log-desc { font-size: 14px; color: var(--text-primary); }
        .log-time { font-size: 12px; color: var(--text-muted); margin-top: 2px; }
        .log-empty { text-align: center; padding: 40px; color: var(--text-muted); font-size: 14px; }
        .tab-nav { display: flex; gap: 4px; background: var(--bg-card); border-radius: var(--radius-md); padding: 4px; margin-bottom: 20px; border: 1px solid var(--border-color); }
        .tab-nav button { flex: 1; padding: 10px; border: none; background: transparent; color: var(--text-secondary); font-size: 14px; font-weight: 500; border-radius: 10px; cursor: pointer; transition: all var(--transition); font-family: inherit; }
        .tab-nav button.active { background: rgba(99,102,241,0.3); color: var(--text-primary); }
        .tab-nav button:hover { color: var(--text-primary); }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        .inline-form { display: flex; gap: 12px; align-items: flex-end; flex-wrap: wrap; }
        .inline-form .form-group { margin-bottom: 0; }
    </style>
</head>
<body>
    <canvas id="particles-canvas"></canvas>
    <div class="app-wrapper profile-wrapper" style="position:relative;z-index:1;">
        <!-- 导航栏 -->
        <div class="user-info" style="position:static;justify-content:flex-end;margin-bottom:24px;padding-top:12px;">
            <span class="username" id="headerUsername">{{ username }}</span>
            <a href="/home" class="btn-test" title="首页">🏠 首页</a>
            <a href="/train" class="btn-test" title="训练面板">🏠 训练</a>
            <a href="/study" class="btn-test" title="AI基础学习">📖 学习</a>
            <a href="/check" class="btn-test" title="模型测试">🧪 测试</a>
            <a href="/logout" class="btn-logout" title="退出登录"
               onclick="event.preventDefault();fetch('/logout',{method:'POST',headers:{'Content-Type':'application/json','X-Requested-With':'XMLHttpRequest'}}).then(r=>r.json()).then(d=>{if(d.status==='success')window.location.href='/login'}).catch(()=>window.location.href='/login')">
                🚪 退出
            </a>
        </div>
        <!-- 头部信息 -->
        <div class="profile-header">
            <div class="profile-avatar">{{ username[0] }}</div>
            <div>
                <div class="profile-name" id="displayName">{{ username }}</div>
                <div class="profile-meta" id="displayMeta">加载中...</div>
            </div>
        </div>

        <!-- 统计卡片 -->
        <div class="stats-row" id="statsRow">
            <div class="stat-card"><div class="num">-</div><div class="label">上传数据集</div></div>
            <div class="stat-card"><div class="num">-</div><div class="label">训练模型</div></div>
            <div class="stat-card"><div class="num">-</div><div class="label">测试记录</div></div>
        </div>

        <!-- 选项卡导航 -->
        <div class="tab-nav">
            <button class="active" onclick="switchTab('logs')">📋 行为记录</button>
            <button onclick="switchTab('settings')">⚙️ 账号设置</button>
        </div>

        <!-- 行为日志 -->
        <div class="tab-content active" id="tabLogs">
            <div class="section-title">📋 最近行为记录</div>
            <ul class="log-list" id="logList">
                <li class="log-empty">⏳ 加载中...</li>
            </ul>
        </div>

        <!-- 账号设置 -->
        <div class="tab-content" id="tabSettings">
            <div class="section-title">✏️ 修改用户名</div>
            <div class="inline-form">
                <div class="form-group">
                    <label>新用户名</label>
                    <input type="text" id="newUsername" placeholder="2-20个字符" value="{{ username }}">
                </div>
                <button class="btn-save" onclick="updateUsername()">保存修改</button>
            </div>
            <div id="usernameMsg" class="msg"></div>

            <div class="section-title" style="margin-top:32px;">🔒 修改密码</div>
            <div class="form-group">
                <label>当前密码</label>
                <input type="password" id="oldPassword" placeholder="输入当前密码">
            </div>
            <div class="form-group">
                <label>新密码</label>
                <input type="password" id="newPassword" placeholder="至少4个字符">
            </div>
            <div class="form-group">
                <label>确认新密码</label>
                <input type="password" id="confirmPassword" placeholder="再次输入新密码">
            </div>
            <button class="btn-save" onclick="updatePassword()">修改密码</button>
            <div id="passwordMsg" class="msg"></div>
        </div>
    </div>

    <script>
        // 从父页面获取用户名（如果是在iframe中）或直接使用
        const currentUsername = '{{ username }}';

        // 加载用户信息
        async function loadProfile() {
            try {
                const res = await fetch('/api/profile/info');
                const data = await res.json();
                if (data.status === 'success') {
                    const u = data.user;
                    document.getElementById('displayName').textContent = u.username;
                    document.getElementById('displayMeta').textContent =
                        `注册于 ${u.created_at?.split('T')[0] || '未知'} · 上次登录 ${u.last_login?.split('T')[0] || '首次'}`;
                    document.querySelectorAll('.stat-card')[0].querySelector('.num').textContent = u.file_count;
                    document.querySelectorAll('.stat-card')[1].querySelector('.num').textContent = u.model_count;
                }
            } catch (e) {
                document.getElementById('displayMeta').textContent = '加载失败';
            }
        }

        // 加载行为日志
        async function loadActivityLogs() {
            const list = document.getElementById('logList');
            try {
                const res = await fetch('/api/profile/activity_logs');
                const data = await res.json();
                if (data.status !== 'success' || !data.logs || data.logs.length === 0) {
                    list.innerHTML = '<li class="log-empty">暂无行为记录</li>';
                    return;
                }
                const iconMap = {
                    'upload': '📤', 'train': '🧠', 'test': '🧪',
                    'profile': '⚙️', 'delete': '🗑️', 'download': '⬇️'
                };
                list.innerHTML = data.logs.map(log => {
                    const icon = iconMap[log.activity_type] || '📌';
                    const detail = log.detail ? `<br><span style="font-size:12px;color:var(--text-muted)">${log.detail}</span>` : '';
                    return `<li class="log-item">
                        <div class="log-icon">${icon}</div>
                        <div class="log-content">
                            <div class="log-desc">${log.description}${detail}</div>
                            <div class="log-time">${log.created_at}</div>
                        </div>
                    </li>`;
                }).join('');

                // 统计测试记录数
                const testCount = data.logs.filter(l => l.activity_type === 'test').length;
                document.querySelectorAll('.stat-card')[2].querySelector('.num').textContent = testCount;
            } catch (e) {
                list.innerHTML = '<li class="log-empty">❌ 加载失败</li>';
            }
        }

        // 修改用户名
        async function updateUsername() {
            const input = document.getElementById('newUsername');
            const btn = event.target;
            const msg = document.getElementById('usernameMsg');
            const name = input.value.trim();
            if (!name || name.length < 2 || name.length > 20) {
                msg.className = 'msg error'; msg.textContent = '用户名长度应为2-20个字符'; return;
            }
            btn.disabled = true; btn.textContent = '⏳ 保存中...';
            try {
                const res = await fetch('/api/profile/update_username', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: name })
                });
                const data = await res.json();
                msg.className = 'msg ' + (data.status === 'success' ? 'success' : 'error');
                msg.textContent = data.message;
                if (data.status === 'success') {
                    document.getElementById('displayName').textContent = name;
                    document.getElementById('headerUsername').textContent = name;
                }
            } catch (e) {
                msg.className = 'msg error'; msg.textContent = '请求失败: ' + e.message;
            }
            btn.disabled = false; btn.textContent = '保存修改';
        }

        // 修改密码
        async function updatePassword() {
            const oldPw = document.getElementById('oldPassword').value;
            const newPw = document.getElementById('newPassword').value;
            const confirmPw = document.getElementById('confirmPassword').value;
            const msg = document.getElementById('passwordMsg');
            if (!oldPw || !newPw) {
                msg.className = 'msg error'; msg.textContent = '请填写所有密码字段'; return;
            }
            if (newPw.length < 4) {
                msg.className = 'msg error'; msg.textContent = '新密码至少4个字符'; return;
            }
            if (newPw !== confirmPw) {
                msg.className = 'msg error'; msg.textContent = '两次密码不一致'; return;
            }
            const btn = event.target;
            btn.disabled = true; btn.textContent = '⏳ 修改中...';
            try {
                const res = await fetch('/api/profile/update_password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ old_password: oldPw, new_password: newPw })
                });
                const data = await res.json();
                msg.className = 'msg ' + (data.status === 'success' ? 'success' : 'error');
                msg.textContent = data.message;
                if (data.status === 'success') {
                    document.getElementById('oldPassword').value = '';
                    document.getElementById('newPassword').value = '';
                    document.getElementById('confirmPassword').value = '';
                }
            } catch (e) {
                msg.className = 'msg error'; msg.textContent = '请求失败: ' + e.message;
            }
            btn.disabled = false; btn.textContent = '修改密码';
        }

        // 切换选项卡
        function switchTab(tab) {
            document.querySelectorAll('.tab-nav button').forEach(b => b.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            event.target.classList.add('active');
            document.getElementById('tab' + tab.charAt(0).toUpperCase() + tab.slice(1)).classList.add('active');
        }

        // 初始化
        loadProfile();
        loadActivityLogs();
    </script>
<script src="{{ url_for('static', filename='js/particles.js') }}"></script>
</body>
</html>
