<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="{{ url_for('static', filename='icon.ico') }}">
    <title>登录 - 训练平台</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        /* 粒子背景画布：必须脱离文档流，否则会作为 body 的 flex 子项占位，
           把登录/注册卡片挤到页面右侧（本页未引入 style.css，需自带该规则） */
        #particles-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
        }
        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background: linear-gradient(135deg, #0f0f1a 0%, #1a1a2e 50%, #16213e 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .auth-container {
            background: rgba(255,255,255,0.05);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 24px;
            padding: 40px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.5);
        }
        .auth-header {
            text-align: center;
            margin-bottom: 32px;
        }
        .auth-header h1 {
            color: #fff;
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 8px;
        }
        .auth-header p {
            color: rgba(255,255,255,0.6);
            font-size: 14px;
        }
        .auth-header .logo {
            font-size: 48px;
            margin-bottom: 12px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            color: rgba(255,255,255,0.8);
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 8px;
        }
        .form-group input {
            width: 100%;
            padding: 14px 16px;
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 12px;
            color: #fff;
            font-size: 15px;
            font-family: inherit;
            transition: all 0.3s ease;
            outline: none;
        }
        .form-group input:focus {
            border-color: #6366f1;
            background: rgba(255,255,255,0.12);
            box-shadow: 0 0 0 3px rgba(99,102,241,0.2);
        }
        .form-group input::placeholder {
            color: rgba(255,255,255,0.3);
        }
        .btn-submit {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            border: none;
            border-radius: 12px;
            color: #fff;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: inherit;
        }
        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(99,102,241,0.4);
        }
        .btn-submit:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        .auth-footer {
            text-align: center;
            margin-top: 24px;
            color: rgba(255,255,255,0.5);
            font-size: 14px;
        }
        .auth-footer a {
            color: #818cf8;
            text-decoration: none;
            font-weight: 600;
        }
        .auth-footer a:hover {
            text-decoration: underline;
        }
        .message {
            padding: 12px 16px;
            border-radius: 12px;
            margin-bottom: 16px;
            font-size: 14px;
            display: none;
        }
        .message.error {
            background: rgba(239,68,68,0.15);
            border: 1px solid rgba(239,68,68,0.3);
            color: #fca5a5;
            display: block;
        }
        .message.success {
            background: rgba(34,197,94,0.15);
            border: 1px solid rgba(34,197,94,0.3);
            color: #86efac;
            display: block;
        }
        .tabs {
            display: flex;
            gap: 4px;
            margin-bottom: 28px;
            background: rgba(255,255,255,0.05);
            border-radius: 12px;
            padding: 4px;
        }
        .tab {
            flex: 1;
            padding: 10px;
            text-align: center;
            border: none;
            background: transparent;
            color: rgba(255,255,255,0.5);
            font-size: 15px;
            font-weight: 500;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: inherit;
        }
        .tab.active {
            background: rgba(99,102,241,0.3);
            color: #fff;
        }
        .tab:hover {
            color: rgba(255,255,255,0.8);
        }
        .password-hint {
            color: rgba(255,255,255,0.3);
            font-size: 12px;
            margin-top: 4px;
        }
    </style>
</head>
<body>
    <canvas id="particles-canvas"></canvas>
    <div class="auth-container" style="position:relative;z-index:1;">
        <div class="auth-header">
            <div class="logo">🧠</div>
            <h1>训练平台</h1>
            <p>登录以管理您的训练任务与模型</p>
        </div>

        <!-- 标签切换：登录 / 注册 -->
        <div class="tabs">
            <button class="tab active" onclick="switchTab('login')" id="tabLogin">登录</button>
            <button class="tab" onclick="switchTab('register')" id="tabRegister">注册</button>
        </div>

        <!-- 消息提示 -->
        <div id="message" class="message"></div>

        <!-- ===== 登录表单 ===== -->
        <form id="loginForm" onsubmit="handleLogin(event)">
            <div class="form-group">
                <label for="loginUsername">用户名</label>
                <input type="text" id="loginUsername" placeholder="输入用户名" required autocomplete="username">
            </div>
            <div class="form-group">
                <label for="loginPassword">密码</label>
                <input type="password" id="loginPassword" placeholder="输入密码" required autocomplete="current-password">
            </div>
            <button type="submit" class="btn-submit" id="loginBtn">🚀 登录</button>
            <div class="auth-footer">
                还没有账号？<a href="#" onclick="switchTab('register'); return false;">立即注册</a>
            </div>
        </form>

        <!-- ===== 注册表单 ===== -->
        <form id="registerForm" style="display:none;" onsubmit="handleRegister(event)">
            <div class="form-group">
                <label for="regUsername">用户名</label>
                <input type="text" id="regUsername" placeholder="2-20个字符" required autocomplete="username">
                <div class="password-hint">字母、数字或下划线</div>
            </div>
            <div class="form-group">
                <label for="regPassword">密码</label>
                <input type="password" id="regPassword" placeholder="至少4个字符" required autocomplete="new-password">
            </div>
            <div class="form-group">
                <label for="regConfirm">确认密码</label>
                <input type="password" id="regConfirm" placeholder="再次输入密码" required>
            </div>
            <button type="submit" class="btn-submit" id="registerBtn">📝 注册</button>
            <div class="auth-footer">
                已有账号？<a href="#" onclick="switchTab('login'); return false;">去登录</a>
            </div>
        </form>
    </div>

    <script>
        const defaultTab = '{{ default_tab }}' || 'login';
        function switchTab(tab) {
            document.getElementById('tabLogin').classList.toggle('active', tab === 'login');
            document.getElementById('tabRegister').classList.toggle('active', tab === 'register');
            document.getElementById('loginForm').style.display = tab === 'login' ? 'block' : 'none';
            document.getElementById('registerForm').style.display = tab === 'register' ? 'block' : 'none';
            document.getElementById('message').style.display = 'none';
        }
        // 初始化：根据URL参数切换到对应标签
        document.addEventListener('DOMContentLoaded', () => switchTab(defaultTab));

        function showMessage(text, type) {
            const msg = document.getElementById('message');
            msg.textContent = text;
            msg.className = 'message ' + type;
            msg.style.display = 'block';
        }

        // 防重复提交守卫：请求进行中忽略再次提交（连点/回车）
        let _submitting = false;

        async function handleLogin(e) {
            e.preventDefault();
            if (_submitting) return false;
            _submitting = true;
            const btn = document.getElementById('loginBtn');
            btn.disabled = true;
            btn.textContent = '⏳ 登录中...';
            
            const username = document.getElementById('loginUsername').value.trim();
            const password = document.getElementById('loginPassword').value;
            
            try {
                const res = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                const data = await res.json();
                
                if (data.status === 'success') {
                    showMessage('✅ 登录成功，正在跳转...', 'success');
                    setTimeout(() => { window.location.href = '/train'; }, 800);
                } else {
                    showMessage('❌ ' + data.message, 'error');
                    _submitting = false;
                    btn.disabled = false;
                    btn.textContent = '🚀 登录';
                }
            } catch (err) {
                showMessage('❌ 登录失败: ' + err.message, 'error');
                _submitting = false;
                btn.disabled = false;
                btn.textContent = '🚀 登录';
            }
        }

        async function handleRegister(e) {
            e.preventDefault();
            if (_submitting) return false;
            _submitting = true;
            const btn = document.getElementById('registerBtn');
            btn.disabled = true;
            btn.textContent = '⏳ 注册中...';

            const username = document.getElementById('regUsername').value.trim();
            const password = document.getElementById('regPassword').value;
            const confirm = document.getElementById('regConfirm').value;

            if (password !== confirm) {
                showMessage('❌ 两次密码不一致', 'error');
                _submitting = false;
                btn.disabled = false;
                btn.textContent = '📝 注册';
                return;
            }
            
            try {
                const res = await fetch('/api/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                const data = await res.json();
                
                if (data.status === 'success') {
                    showMessage('✅ 注册成功！请登录', 'success');
                    setTimeout(() => { switchTab('login'); }, 1000);
                } else {
                    showMessage('❌ ' + data.message, 'error');
                }
            } catch (err) {
                showMessage('❌ 注册失败: ' + err.message, 'error');
            }
            
            btn.disabled = false;
            btn.textContent = '📝 注册';
        }
    </script>
<script src="{{ url_for('static', filename='js/particles.js') }}"></script>
</body>
</html>
